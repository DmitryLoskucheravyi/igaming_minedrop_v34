# ============================================================
# Локальна інфраструктура для розробки.
#
#   docker compose up -d        підняти
#   docker compose down         зупинити (дані лишаються)
#   docker compose down -v      знести разом із даними
#
# MongoDB піднято як single-node replica set (rs0): один вузол,
# але в режимі replica set — щоб працювали транзакції й change
# streams, і щоб рядок підключення був такий самий, як до Atlas.
#
# Replica set ініціюється сам через healthcheck (rs.initiate при
# першому старті). Перші ~15-30 с після `up` база ще не готова —
# дочекайся, поки `docker compose ps` покаже mongo як healthy.
#
# Compass / застосунок підключаються так:
#   mongodb://localhost:27017/minedrop?directConnection=true
# ============================================================

# Ім'я проєкту задано явно: каталог репо містить не-ASCII символи
# ("Нова папка"), і Compose не може вивести ім'я з нього автоматично.
name: minedrop

services:
  mongo:
    image: mongo:7
    container_name: minedrop-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Якщо replica set ще не піднятий — ініціюємо його одним вузлом.
      # host має бути localhost:27017, щоб підключення з хоста
      # (Compass, `npm run dev`) працювали з directConnection=true.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
          }
        "
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 10

volumes:
  mongo-data:
